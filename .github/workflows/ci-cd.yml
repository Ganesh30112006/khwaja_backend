# CI on every push and pull request: type check, API tests against a real PostgreSQL, build.
# CD on main: package for Elastic Beanstalk and deploy (only once the AWS repository variables are set).
#
# Repository variables (Settings > Secrets and variables > Actions > Variables):
#   AWS_ROLE_ARN     IAM role GitHub assumes through OIDC (no AWS keys stored in GitHub)
#   AWS_REGION       e.g. ap-south-1
#   EB_APP           Elastic Beanstalk application name
#   EB_ENV           Elastic Beanstalk environment name
#   EB_BUCKET        S3 bucket for application versions
#   API_HEALTH_URL   e.g. https://dxxxx.cloudfront.net/api/health (checked after the deploy)
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    # One deploy at a time; a newer push waits for the running one instead of interrupting it.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EB_APP: ${{ vars.EB_APP }}
      EB_ENV: ${{ vars.EB_ENV }}
      EB_BUCKET: ${{ vars.EB_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build and package
        run: |
          npm ci
          npm run build
          mkdir -p certs
          curl -fsSL https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem -o certs/rds-global-bundle.pem
          zip -qr voter-desk-backend.zip dist migrations certs .ebextensions package.json package-lock.json
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy to Elastic Beanstalk
        run: |
          VERSION="${GITHUB_SHA::12}-${GITHUB_RUN_ATTEMPT}"
          aws s3 cp voter-desk-backend.zip "s3://$EB_BUCKET/voter-desk-backend/$VERSION.zip"
          aws elasticbeanstalk create-application-version --application-name "$EB_APP" --version-label "$VERSION" \
            --description "${GITHUB_SHA}" --source-bundle "S3Bucket=$EB_BUCKET,S3Key=voter-desk-backend/$VERSION.zip" --process
          # --process validates the bundle in the background; wait until the version is usable.
          for i in $(seq 1 30); do
            STATUS=$(aws elasticbeanstalk describe-application-versions --application-name "$EB_APP" --version-labels "$VERSION" \
              --query 'ApplicationVersions[0].Status' --output text)
            [ "$STATUS" = "PROCESSED" ] && break
            [ "$STATUS" = "FAILED" ] && { echo "Application version failed validation"; exit 1; }
            sleep 5
          done
          [ "$STATUS" = "PROCESSED" ] || { echo "Application version not ready (status $STATUS)"; exit 1; }
          aws elasticbeanstalk wait environment-updated --environment-names "$EB_ENV"
          aws elasticbeanstalk update-environment --environment-name "$EB_ENV" --version-label "$VERSION"
          aws elasticbeanstalk wait environment-updated --environment-names "$EB_ENV"
          read -r DEPLOYED HEALTH <<<"$(aws elasticbeanstalk describe-environments --environment-names "$EB_ENV" \
            --query 'Environments[0].[VersionLabel,Health]' --output text)"
          echo "Deployed $DEPLOYED, health $HEALTH"
          test "$DEPLOYED" = "$VERSION"
          test "$HEALTH" != "Red"
      - name: Check the API through CloudFront
        if: vars.API_HEALTH_URL != ''
        run: |
          for i in $(seq 1 10); do
            curl -fsS "${{ vars.API_HEALTH_URL }}" && exit 0
            sleep 10
          done
          echo "Health check failed"; exit 1
