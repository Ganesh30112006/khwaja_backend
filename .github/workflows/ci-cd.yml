# CI on every push and pull request: type check, API tests against a real PostgreSQL, build.
# CD on main: package for Elastic Beanstalk and deploy to the Mumbai environment.
#
# AWS access is through GitHub OIDC (no AWS keys stored in GitHub): the role trusts only this repo's
# "production" environment. The values below are not secrets; repository variables of the same name override them.
# GitHub sends the subject with numeric IDs: repo:Ganesh30112006@204135162/khwaja_backend@1431622954:environment:production
# (the role trust policy must match it exactly; renaming or re-creating the repo changes the repo ID).
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    # One deploy at a time; a newer push waits for the running one instead of interrupting it.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN || 'arn:aws:iam::492462083767:role/voterdesk-backend-deploy' }}
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      EB_APP: ${{ vars.EB_APP || 'voter-desk' }}
      EB_ENV: ${{ vars.EB_ENV || 'voter-desk-api' }}
      EB_BUCKET: ${{ vars.EB_BUCKET || 'elasticbeanstalk-ap-south-1-492462083767' }}
      API_HEALTH_URL: ${{ vars.API_HEALTH_URL || 'https://d37boaln3snj1u.cloudfront.net/api/health' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Build and package
        run: |
          npm ci
          npm run build
          mkdir -p certs
          curl -fsSL https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem -o certs/rds-global-bundle.pem
          zip -qr voter-desk-backend.zip dist migrations certs .ebextensions package.json package-lock.json
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy to Elastic Beanstalk
        run: |
          VERSION="${GITHUB_SHA::12}-${GITHUB_RUN_ATTEMPT}"
          aws s3 cp voter-desk-backend.zip "s3://$EB_BUCKET/voter-desk-backend/$VERSION.zip"
          aws elasticbeanstalk create-application-version --application-name "$EB_APP" --version-label "$VERSION" \
            --description "${GITHUB_SHA}" --source-bundle "S3Bucket=$EB_BUCKET,S3Key=voter-desk-backend/$VERSION.zip" --process
          # --process validates the bundle in the background; wait until the version is usable.
          for i in $(seq 1 30); do
            STATUS=$(aws elasticbeanstalk describe-application-versions --application-name "$EB_APP" --version-labels "$VERSION" \
              --query 'ApplicationVersions[0].Status' --output text)
            [ "$STATUS" = "PROCESSED" ] && break
            [ "$STATUS" = "FAILED" ] && { echo "Application version failed validation"; exit 1; }
            sleep 5
          done
          [ "$STATUS" = "PROCESSED" ] || { echo "Application version not ready (status $STATUS)"; exit 1; }
          aws elasticbeanstalk wait environment-updated --environment-names "$EB_ENV" --no-include-deleted
          aws elasticbeanstalk update-environment --environment-name "$EB_ENV" --version-label "$VERSION"
          # Immutable deploys start new servers first and can take longer than the CLI waiter's ~7 minutes.
          for i in $(seq 1 90); do
            sleep 20
            [ "$(aws elasticbeanstalk describe-environments --environment-names "$EB_ENV" --no-include-deleted --query 'Environments[0].Status' --output text)" = "Ready" ] && break
          done
          read -r DEPLOYED HEALTH <<<"$(aws elasticbeanstalk describe-environments --environment-names "$EB_ENV" --no-include-deleted \
            --query 'Environments[0].[VersionLabel,Health]' --output text)"
          echo "Deployed $DEPLOYED, health $HEALTH"
          test "$DEPLOYED" = "$VERSION"
          test "$HEALTH" != "Red"
      - name: Check the API through CloudFront
        run: |
          for i in $(seq 1 10); do
            curl -fsS "$API_HEALTH_URL" && exit 0
            sleep 10
          done
          echo "Health check failed"; exit 1
